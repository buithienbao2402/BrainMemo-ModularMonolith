openapi: 3.0.3
info:
  title: BrainMemo LMS API
  version: 1.0.0
  description: |
    Quy ước: lỗi mặc định 400/401/403/404/422/429 (Problem) cho mọi operation.
    401 chưa đăng nhập; 403 thiếu quyền; 404 giấu sự tồn tại. Phân trang page/pageSize (<=50).
    Thời gian ISO-8601 UTC; ID UUID chuỗi; thông điệp lỗi tiếng Việt.
servers: [{url: /api/v1}]
security: [{bearerAuth: []}]
tags:
  - {name: Identity}
  - {name: Profile}
  - {name: Files}
  - {name: Course}
  - {name: Content}
  - {name: Learning}
  - {name: Assessment}
  - {name: Discovery}
  - {name: Notification}
  - {name: Moderation}
  - {name: AI}
  - {name: Admin}
paths: {}   # được điền bởi tools/merge-openapi
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Page: {name: page, in: query, schema: {type: integer, minimum: 1, default: 1}}
    PageSize: {name: pageSize, in: query, schema: {type: integer, minimum: 1, maximum: 50, default: 20}}
    CourseId: {name: courseId, in: path, required: true, schema: {type: string, format: uuid}}
    ChapterId: {name: chapterId, in: path, required: true, schema: {type: string, format: uuid}}
    BlockId: {name: blockId, in: path, required: true, schema: {type: string, format: uuid}}
    QuestionId: {name: questionId, in: path, required: true, schema: {type: string, format: uuid}}
    UserId: {name: userId, in: path, required: true, schema: {type: string, format: uuid}}
    Id: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  responses:
    Problem:
      description: Lỗi (RFC 9457)
      content: {application/problem+json: {schema: {$ref: '#/components/schemas/Problem'}}}
  schemas:
    Problem:
      type: object
      required: [title, status, code]
      properties:
        type: {type: string}
        title: {type: string, description: Thông điệp tiếng Việt}
        status: {type: integer}
        detail: {type: string}
        code: {type: string, description: 'Mã máy đọc, xem contracts/README.md bảng mã lỗi'}
        traceId: {type: string}
        errors: {type: array, items: {type: object, properties: {field: {type: string}, message: {type: string}}}}
    PageMeta:
      type: object
      required: [page, pageSize, totalItems, totalPages]
      properties: {page: {type: integer}, pageSize: {type: integer}, totalItems: {type: integer}, totalPages: {type: integer}}
    UserRef:
      type: object
      properties: {id: {type: string, format: uuid}, displayName: {type: string}, avatarUrl: {type: string, nullable: true}}
    AccessMode: {type: string, enum: [PUBLIC, PRIVATE, ONLY_ME]}
    CourseStatus: {type: string, enum: [UPDATING, COMPLETED, PAUSED]}
    BlockType: {type: string, enum: [RICH_TEXT, IMAGE, VIDEO, AUDIO, FILE, MARKDOWN, FLASHCARD, QUESTION, ASSIGNMENT, QUIZ]}
    QuestionType: {type: string, enum: [MULTIPLE_CHOICE, TRUE_FALSE, FILL_BLANK, MATCHING, SHORT_ESSAY, ESSAY]}
    IdBody: {type: object, properties: {id: {type: string, format: uuid}}}