                purpose:
                  type: string
                  enum:
                    - AVATAR
                    - COURSE_COVER
                    - COURSE_RESOURCE
                    - ASSIGNMENT_FILE
                    - REPORT_EVIDENCE
                fileName:
                  type: string
                sizeBytes:
                  type: integer
                contentType:
                  type: string
                courseId:
                  type: string
                  format: uuid
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrlDto"
  /auth/register:
    post:
      tags:
        - Identity
      operationId: register
      security: []
      summary: Đăng ký (FR-IDN-01)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "201":
          description: Đã tạo; gửi email xác minh
        "409":
          description: EMAIL_TAKEN
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
