    put:
      tags:
        - Course
      operationId: setChapterAccess
      summary: Chế độ truy cập chương (FR-CRS-07). PROTECTED bắt buộc passcode; đổi passcode vô hiệu unlock cũ
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ChapterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - accessMode
              properties:
                accessMode:
                  type: string
                  enum:
                    - PUBLIC
                    - PROTECTED
                passcode:
                  type: string
                  minLength: 4
      responses:
        "204":
          description: OK
    get:
      tags:
        - Course
      operationId: getChapterAccess
      summary: Xem cấu hình (không trả passcode)
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ChapterId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessMode:
                    type: string
                  passcodeVersion:
                    type: integer
