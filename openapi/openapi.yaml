      tags:
        - Course
      operationId: decideEnrollmentRequest
      summary: Duyệt/từ chối yêu cầu Private (FR-CRS-10)
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - name: requestId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - decision
              properties:
                decision:
                  type: string
                  enum:
                    - ACCEPTED
                    - REJECTED
      responses:
        "204":
          description: OK
