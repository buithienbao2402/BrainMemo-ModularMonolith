            enum:
              - PENDING_APPROVAL
              - INVITED
              - ACTIVE
              - LEFT
              - REMOVED
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/EnrollmentDto"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
