    post:
      tags:
        - Content
      operationId: createQuestion
      summary: Tạo câu hỏi (FR-CNT-04)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionUpsert"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionDto"
  /courses/{courseId}/questions/{questionId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
      - $ref: "#/components/parameters/QuestionId"
    get:
      tags:
        - Content
      operationId: getQuestion
      summary: Chi tiết (kèm đáp án; Chủ khóa)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionDto"
    put:
      tags:
        - Content
      operationId: updateQuestion
      summary: Sửa
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuestionUpsert"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuestionDto"
  /courses/{courseId}/questions/{questionId}/status:
    put:
      tags:
        - Content
      operationId: setQuestionStatus
      summary: DRAFT↔READY, →ARCHIVED, ARCHIVED→DRAFT. READY kiểm hợp lệ theo loại (INVALID_STATE)
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/QuestionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - DRAFT
                    - READY
                    - ARCHIVED
      responses:
        "204":
          description: OK
  /courses/{courseId}/questions/{questionId}/usage:
    get:
      tags:
        - Content
      operationId: getQuestionUsage
      summary: Câu nằm trong bài nào, số lượt, tỷ lệ đúng (FR-CNT-08)
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/QuestionId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  quizzes:
                    type: array
                    items:
                      type: object
                      properties:
                        blockId:
                          type: string
                        title:
                          type: string
                  attemptCount:
                    type: integer
                  correctRate:
                    type: number
                    nullable: true
  /courses/{courseId}/questions/import:
    post:
      tags:
        - Content
      operationId: importQuestions
      summary: Nhập Excel/CSV (FR-CNT-05). multipart/form-data; trả báo cáo từng dòng
      parameters:
        - $ref: "#/components/parameters/CourseId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  imported:
                    type: integer
                  errors:
                    type: array
