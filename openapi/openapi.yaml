          description: OK
    delete:
      tags:
        - Content
      operationId: deleteQuizException
      summary: Xóa ngoại lệ
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/BlockId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: OK
  /courses/{courseId}/resources:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags:
        - Content
      operationId: listResources
      summary: Tài nguyên (FR-CNT-18)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ResourceDto"
    post:
      tags:
        - Content
      operationId: createResource
