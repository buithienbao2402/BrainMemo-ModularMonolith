    post:
      tags:
        - Identity
      operationId: login
      security: []
      summary: Đăng nhập (FR-IDN-03). Set cookie refresh. Lỗi INVALID_CREDENTIALS, ACCOUNT_LOCKED (403, kèm
        lockedUntil/lockReason trong extensions)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CredentialsRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokens"
