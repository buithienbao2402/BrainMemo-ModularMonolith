              - NEWEST_LAUNCH
              - MOST_REVIEWED
              - MOST_NOMINATED
              - MOST_LEARNERS
              - MOST_COMMENTED
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
