    post:
      tags:
        - Identity
      operationId: verifyEmail
      security: []
      summary: Xác minh email (FR-IDN-02)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
      responses:
        "204":
          description: OK; lỗi TOKEN_INVALID_OR_EXPIRED
