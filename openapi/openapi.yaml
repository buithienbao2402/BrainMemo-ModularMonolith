              properties:
                uploadKey:
                  type: string
                originalFilename:
                  type: string
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourceDto"
  /courses/{courseId}/resources/{id}:
    delete:
      tags:
        - Content
      operationId: deleteResource
