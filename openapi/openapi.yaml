    put:
      tags:
        - Course
      operationId: nominateCourse
      summary: Đề cử (FR-CRS-15; idempotent)
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: OK
    delete:
      tags:
        - Course
      operationId: withdrawNomination
      summary: Thu hồi đề cử (FR-CRS-16)
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "204":
          description: OK
