    get:
      tags:
        - Discovery
      operationId: getHome
      security:
        - {}
        - bearerAuth: []
      summary: "Trang chủ: mới cập nhật, đề xuất NGẪU NHIÊN mỗi lần tải, đang học dở (nếu đăng nhập) (FR-DSC-01..03)"
      responses:
        "200":
