              - LEARNERS
              - REVIEWS
              - NOMINATIONS
        - name: window
          in: query
          required: true
          schema:
            type: string
            enum:
              - WEEK
              - MONTH
              - ALL_TIME
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
