      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpsertRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDto"
    delete:
      tags:
        - Course
      operationId: deleteCourse
      summary: Xóa mềm (FR-CRS-04)
      responses:
        "204":
          description: OK
  /courses/{courseId}/stats:
    get:
      tags:
        - Course
      operationId: getCourseStats
