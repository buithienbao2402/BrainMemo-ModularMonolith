    get:
      tags:
        - Course
      operationId: listMyInvitations
      summary: Lời mời đang chờ của tôi
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CourseCard"
