        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                  expiresAt:
                    type: string
                    format: date-time
  /courses:
    post:
      tags:
        - Course
      operationId: createCourse
      summary: Tạo khóa (FR-CRS-01). Cần email đã xác minh (EMAIL_NOT_VERIFIED)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseUpsertRequest"
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDto"
  /courses/{courseId}:
    parameters:
      - $ref: "#/components/parameters/CourseId"
    get:
      tags:
        - Course
      operationId: getCourse
      security:
        - {}
        - bearerAuth: []
      summary: Xem khóa (FR-CRS-02). Only Me/Tạm ẩn/Đã xóa với người khác → 404
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDto"
    patch:
      tags:
        - Course
      operationId: updateCourse
      summary: Sửa thông tin/trạng thái/chế độ truy cập/tag (FR-CRS-03,05,06). Đổi sang ONLY_ME khi đang Tạm ẩn →
