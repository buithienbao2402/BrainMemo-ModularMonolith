    get:
      tags:
        - Discovery
      operationId: listSearchHistory
      summary: Lịch sử tìm kiếm (FR-DSC-05)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    queryText:
                      type: string
                    createdAt:
                      type: string
                      format: date-time
