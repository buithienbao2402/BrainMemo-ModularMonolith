                  type: string
                  format: email
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentDto"
  /courses/{courseId}/invitations/accept:
    post:
      tags:
        - Course
      operationId: acceptInvitation
      summary: Chấp nhận lời mời (INVITED → ACTIVE)
      parameters:
        - $ref: "#/components/parameters/CourseId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollmentDto"
