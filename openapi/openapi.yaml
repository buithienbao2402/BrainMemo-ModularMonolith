      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: OK
  /courses/{courseId}/resources/{id}/download-url:
    get:
      tags:
        - Content
      operationId: getResourceDownloadUrl
