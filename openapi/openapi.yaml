                    items:
                      $ref: "#/components/schemas/CourseCard"
                  recommended:
                    type: array
                    items:
                      $ref: "#/components/schemas/CourseCard"
                  inProgress:
                    type: array
                    items:
                      $ref: "#/components/schemas/CourseCard"
  /discovery/courses:
    get:
      tags:
        - Discovery
      operationId: searchCourses
      security:
        - {}
        - bearerAuth: []
      summary: Tìm/lọc/sắp xếp (FR-DSC-04,06..09). Đăng nhập → ghi lịch sử
      parameters:
        - name: q
          in: query
          schema:
            type: string
        - name: tag
          in: query
          schema:
            type: string
        - name: accessMode
          in: query
          schema:
            type: string
            enum:
              - PUBLIC
              - PRIVATE
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/CourseStatus"
        - name: sort
          in: query
          schema:
            type: string
