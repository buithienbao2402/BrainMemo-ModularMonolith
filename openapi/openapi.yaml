      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDto"
    put:
      tags:
        - Profile
      operationId: updateMyProfile
      summary: Cập nhật hồ sơ (FR-PRF-01..04,07). avatarUploadKey lấy từ /files/upload-urls
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDto"
  /profiles/{userId}:
    get:
      tags:
        - Profile
      operationId: getPublicProfile
      security:
        - {}
        - bearerAuth: []
      summary: Hồ sơ công khai (FR-PRF-06)
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileDto"
  /profiles/{userId}/courses:
    get:
      tags:
        - Profile
      operationId: listProfileCourses
      security:
        - {}
        - bearerAuth: []
      summary: "Khóa trên hồ sơ (FR-PRF-05). relation=OWNED|ENROLLED|COMPLETED. Người khác xem: chỉ Public/Private, 404 nếu
        showCourseList=false"
      parameters:
        - $ref: "#/components/parameters/UserId"
        - name: relation
          in: query
          schema:
            type: string
            enum:
              - OWNED
              - ENROLLED
              - COMPLETED
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CourseCard"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
