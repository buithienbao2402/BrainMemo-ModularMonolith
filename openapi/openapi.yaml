        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/CourseCard"
                  meta:
                    $ref: "#/components/schemas/PageMeta"
  /courses/{courseId}/enrollments:
    parameters:
      - $ref: "#/components/parameters/CourseId"
