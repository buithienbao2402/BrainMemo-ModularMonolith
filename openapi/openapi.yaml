    post:
      tags:
        - Course
      operationId: unlockChapter
      summary: Nhập passcode chương. Rate limit theo (user, chương)
      parameters:
        - $ref: "#/components/parameters/CourseId"
        - $ref: "#/components/parameters/ChapterId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - passcode
              properties:
                passcode:
                  type: string
      responses:
        "204":
          description: OK
