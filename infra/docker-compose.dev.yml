name: ${COMPOSE_PROJECT_NAME:-brainmemo}

services:
  mysql:
    image: mysql:8.0
    container_name: brainmemo-mysql-dev
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-brainmemo_root_dev_pw}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-brainmemo_lms}
      MYSQL_USER: ${MYSQL_USER:-brainmemo}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-brainmemo_dev_pw}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ../db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s

  minio:
    image: pgsty/silo:latest
    container_name: brainmemo-minio-dev
    restart: unless-stopped
    env_file:
      - path: ../.env
        required: false
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-brainmemo_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-brainmemo_minio_dev_pw}
      MINIO_API_CORS_ALLOW_ORIGIN: "*"
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s

  minio-init:
    image: pgsty/mc:latest
    container_name: brainmemo-minio-init-dev
    depends_on:
      minio:
        condition: service_healthy
    env_file:
      - path: ../.env
        required: false
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-brainmemo_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-brainmemo_minio_dev_pw}
      MINIO_BUCKET: ${MINIO_BUCKET:-brainmemo-media}
      MC_CONFIG_DIR: /tmp/.mc
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        rules="$$(mc ilm rule ls "local/$$MINIO_BUCKET" 2>/dev/null || true)"
        case "$$rules" in
          *"tmp/"*) echo "Lifecycle rule for tmp/ already exists" ;;
          *) mc ilm rule add --expire-days 1 --prefix "tmp/" "local/$$MINIO_BUCKET" ;;
        esac
        mc ilm rule ls "local/$$MINIO_BUCKET"
    restart: "no"

  mailpit:
    image: axllent/mailpit:latest
    container_name: brainmemo-mailpit-dev
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 10

  ai-service:
    build:
      context: ../ai-service
      dockerfile: Dockerfile
    container_name: brainmemo-ai-service-dev
    restart: unless-stopped
    ports:
      - "${AI_SERVICE_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mysql_data:
  minio_data:

